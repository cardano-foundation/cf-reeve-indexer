apiPrefix: /api/v1
spring:
  mvc:
    problemdetails:
      enabled: true
  application:
    name: reeve-indexing-example
  flyway:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=indexer
    user: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    schemas: ${DB_SCHEMA:indexer}
    locations: classpath:db/store/{vendor}
    out-of-order: true
    cleanDisabled: ${FLYWAY_CLEAN_DISABLED:false}
    cleanOnValidationError: ${FLYWAY_CLEAN_ON_ERROR:true}
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=indexer
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jackson:
    property-naming-strategy: SNAKE_CASE
  jpa:
    hibernate:
      ddl-auto: none
reeve:
  label: 1447
  dashboard-folder-path: ./dashboards
store:
  cardano:
    host: 127.0.0.1
    port: 3001
    # 42 is protocol magic for Yaci-Dev-Kit
    protocol-magic: 42
    # for devnet we must specify the genesis files for Yaci-Store
    byron-genesis-file: classpath:/devel/config/devkit/byron-genesis.json
    shelley-genesis-file: classpath:/devel/config/devkit/shelley-genesis.json
    alonzo-genesis-file: classpath:/devel/config/devkit/alonzo-genesis.json
    conway-genesis-file: classpath:/devel/config/devkit/conway-genesis.json

    sync-start-blockhash:
    sync-start-slot: 0
  executor:
    enable-parallel-processing: false
  core:
    enabled: true
  metadata:
    api-enabled: false
server:
  port: 9003

keri:
  enabled: true
  metadata-label: 170
  url: http://127.0.0.1:3901
  bootUrl: http://127.0.0.1:3903
  # STABLE passcode for the indexer's OWN KERI agent AID (card-attestation ceremony, design doc
  # Part A / A2). Must be set per deployment for a stable identity — see application.yml's `bran`
  # comment for why (a rotating value breaks Veridian wallet pairings on every restart).
  bran: ${KERI_BRAN:0A98gEaYge5XlagRM9okY}
  # Alias the indexer's own KERI agent AID is created/looked up under. Must be set per deployment
  # for a stable identity — see application.yml's `identifier-name` comment.
  identifier-name: ${KERI_IDENTIFIER_NAME:reeve-attestation}
  # Deprecated: use credential-schemas[].oobis instead. Still honored for one release
  # (unioned with every configured schema's oobis) at startup OOBI resolution.
  oobis:
    - http://keria:3902/oobi/EJO54wp79Apo4pOyAloOVQw9BQlVohycPWV0FaurG8Br/agent/EOS8r7jbPS1rYKR7duLMfuSwQsNUuUPmuFq4b-ORm9ih
  # Exact SAIDs / trusted AIDs / OOBIs must be filled per deployment.
  credential-schemas:
    - said: ${KERI_VLEI_SCHEMA_SAID:}
      name: "vLEI Legal Entity"
      chained: true
      trusted-roots:
        - ${KERI_VLEI_GLEIF_ROOT_AID:}
      trusted-issuers: []
      oobis: ${KERI_VLEI_OOBIS:}
    - said: "EL9oOWU_7zQn_rD--Xsgi3giCWnFDaNvFMUGTOZx1ARO"
      name: "Foundation Employee"
      chained: false
      trusted-roots: []
      trusted-issuers:
        - ${KERI_DEMO_ISSUER_AID:EEYYK6bKLenwD0ZvydD9q5FDY85IKFJtOdmEcdx2izl1}
      # The OOBI is what lets this agent reach the issuer. Trust checks now FAIL CLOSED when a schema
      # names no issuers, so both of these have to be real for Foundation credentials to verify.
      oobis: ${KERI_DEMO_OOBIS:https://keria-ext.dev.idw-sandboxes.cf-deployments.org/oobi/EEYYK6bKLenwD0ZvydD9q5FDY85IKFJtOdmEcdx2izl1/agent/EFjYeBVmKSZ0eJXkNZqLAlPPiDaRds3V2iH_COkxIs4x}
